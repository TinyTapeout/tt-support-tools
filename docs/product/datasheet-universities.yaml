# ---------------------------------------------------------------------------
# Tiny Tapeout datasheet — UNIVERSITY EDITION.
#
#     python3 docs/product/build.py --config docs/product/datasheet-universities.yaml \
#                                   --out docs/product/tt-datasheet-universities.html --pdf
#
# Same template and assets as datasheet.yaml; the difference is audience. This
# one is written for a department buying for a cohort, so it speaks in "we/our
# students", leads on per-student cost, and answers procurement and calendar
# questions an individual buyer never asks. Editing notes are in datasheet.yaml.
# ---------------------------------------------------------------------------

doc:
  title: Tiny Tapeout for Universities
  wordmark: Tiny Tapeout
  wordmark_sub: ""
  tag: FOR UNIVERSITIES
  ref: ""
  page2_title: Electrical Specifications

theme:
  brand: "#0c66ab"           # header bars and table header rows
  red: "#ec3013"
  tag_bg: "#fef244"
  tag_fg: "#040371"
  ink: "#141414"
  ink_mid: "#55545f"
  ink_faint: "#86858f"
  ground: "#f2f1f4"
  rule: "#c9c8d0"
  rule_hard: "#141414"
