  body_size: 8.3pt

assets:
  photo: demoboard.jpg
  font: archivo.woff2

# --------------------------------------------------------------------------
# PAGE 1
# --------------------------------------------------------------------------

hero:
  eyebrow: ""                # short line above the headline; blank to hide
  heading: Get your class on silicon from €70 per design
  body: >-
    Students submit designs onto regular shuttles with a few clicks. Hundreds
    are combined into a multi project chip and manufactured on an open source
    PDK. The cohort shares a set of easy to use demoboards for bring-up and test.
  photo_alt: Tiny Tapeout demoboard with a QFN-64 packaged ASIC on a breakout board
  photo_caption: ""

features:
  - kicker: Cohort
    title: All designs on one chip
    body: >-
      Enable and test each design in turn with our easy to use demoboard. Students can share
      hardware instead of buying one board per student.
  - kicker: IT footprint
    title: No install needed
    body: >-
      The flow can run in a GitHub Action. Any student laptop with a browser is
      enough. A Docker image is available for local development.
  - kicker: Process
    title: Three PDKs, no NDAs
    body: >-
      SkyWater sky130, IHP sg13g2 and GlobalFoundries gf180mcu — 10+ shuttles a
      year across three open-source PDKs.
  - kicker: I/O
    title: 26 pins, plus analog
    body: >-
      Clock, reset, 8 dedicated inputs, 8 dedicated outputs and 8 bidirectional
      pins — plus up to 6 analog pins where the process allows.
  - kicker: Flexibility
    title: Use your own EDA tools
    body: >-
      Any toolchain, commercial or open source, as long as the GDS and LEF can
      be published.
  - kicker: Resources
    title: Teach it your way
    body: >-
      Bring your own course or use our workshops and HDL templates. Build a course based on the RISC-V
      CPU, FPGA and analog FPGA included on each chip.

quotes:
  heading: ""                # blank keeps the quotes as a band with no heading
  items:
    - text: >-
        “Tiny Tapeout has been an exciting game changer for my students and the
        broader microelectronics community. It helps us attract much-needed new
        talents into a field that has previously failed to provide highly
        accessible on-ramps.”
      name: Prof. Boris Murmann
      affiliation: Chair, IEEE Solid-State Circuits Society · University of Hawai‘i
    - text: >-
        “Tiny Tapeout is genius! It allows students, hobbyists, and
        professionals to easily create custom silicon circuit blocks, supporting
        digital, analog, or mixed-signal… indispensable for modern IC design
        education!”
      name: Prof. Harald Pretl
      affiliation: Senior Principal Engineer, Intel · JKU Linz

pricing:
  heading: What a cohort costs
  note: ""
  columns:
    - {label: Item, width: "27%", style: name}
    - {label: What it buys you}
    - {label: From, width: "22%", style: price}
  rows:
    - ["1 tile",
       "Smallest purchasable area - fits roughly 1,000 standard cells. Dimensions vary by PDK, see page 2.",
       "€70"]
    - ["Analog pin",
       "Multiplexed analog pad access for mixed signal work. Minimum project size of 2 tiles applies.",
       "€100 <span class=\"t-sub\">/ pin, max 6</span>"]
    - ["Demoboard PCB",
       "Packaged chip on a demoboard. Control via USBC, 3 Pmod ports, clock and power supply. Write test scripts with MicroPython",
       "€300 <span class=\"t-sub\">each</span>"]
    - ["Postage &amp; packing",
       "Flat rate worldwide, charged once per demoboard.",
       "€15"]
  footnote: >-
    <b>A class of 25, each submitting one design, sharing 5 demoboards for
    testing: 25 tiles (€1,750) + 5 boards (€1,500) + postage (5 × €15) = €3,325,
    or €133 a student.</b> Every extra student after that is €70. Price your
    own cohort at
    <b><a href="https://app.tinytapeout.com/calculator">app.tinytapeout.com/calculator</a></b>,
    or email
    <b><a href="mailto:education@tinytapeout.com">education@tinytapeout.com</a></b>
    for a quote.

faq:
  heading: What departments ask
  note: FULL FAQ AT TINYTAPEOUT.COM/FAQ
  items:
    - q: How does this fit our academic calendar?
      a: >-
        Fabrication takes 6–9 months and delivery up to a year, so a design
        submitted in one academic year may return in the next. Students can work
        with the previous year’s submissions in a bring-up module that grows lab
        skills and demonstrates why documentation matters.
    - q: How do we pay?
      a: >-
        We invoice institutions directly, accept purchase orders and issue
        written quotes your finance office can approve against. VAT invoices are
        available.
    - q: Do our students need prior experience?
      a: >-
        No. Guides and videos take beginners from first design to submission.
        Thousands of past projects are already published to learn from.
    - q: Who owns the work?
      a: >-
        Every design is published publicly under Apache-2.0, so Tiny Tapeout
        does not suit confidential or commercially sensitive research. Full
        terms at <a href="https://tinytapeout.com/terms">tinytapeout.com/terms</a>.

